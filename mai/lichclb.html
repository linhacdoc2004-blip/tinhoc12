<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch hoạt động CLB Pastel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdfdfd;
        }

        /* Liên kết */
        a {
            font-size: 20px;
            color: #7e57c2;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            color: #5e35b1;
        }

        /* Bảng pastel */
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #a5d6a7; /* xanh mint pastel */
            color: #333;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #fce4ec; /* hồng pastel */
        }

        tr:nth-child(odd) {
            background-color: #e1bee7; /* tím pastel */
        }
    </style>
</head>
<body>
